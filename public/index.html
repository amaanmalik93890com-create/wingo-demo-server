
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 Second Demo</title>
<style>
body {
  background: #351516;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 15px;
}
.box {
  background: #572426;
  padding: 20px;
  border-radius: 15px;
  margin: 15px 0;
}
h1 { color: #ffb5a5; }
.timer {
  font-size: 50px;
  color: #ffd080;
  font-weight: bold;
}
table {
  width: 100%;
  color: white;
}
td, th {
  padding: 10px;
  border-bottom: 1px solid #855;
}
</style>
</head>
<body>

<h1>30 Second Demo</h1>

<div class="box">
  <div>Current Session</div>
  <h2 id="period">Session 1</h2>
  <div class="timer" id="timer">30</div>
  <p>Seconds Remaining</p>
</div>

<div class="box">
  <h3>Session Status</h3>
  <h2 id="status">Running</h2>
</div>

<div class="box">
  <h3>Session History</h3>
  <table>
    <thead>
      <tr>
        <th>Session</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="history"></tbody>
  </table>
</div>

<script>
let session = 1;
let endTime = Date.now() + 30000;
let history = [];

function update() {
  const remaining = Math.max(0, endTime - Date.now());
  document.getElementById("timer").textContent =
    Math.ceil(remaining / 1000);

  document.getElementById("period").textContent =
    "Session " + session;

  if (remaining === 0) {
    history.unshift({
      session: session,
      status: "Completed"
    });

    session++;
    endTime = Date.now() + 30000;
    renderHistory();
  }
}

function renderHistory() {
  document.getElementById("history").innerHTML =
    history.map(item =>
      `<tr><td>${item.session}</td>
      <td>${item.status}</td></tr>`
    ).join("");
}

update();
setInterval(update, 200);
</script>

</body>
</html>
