<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinGo 30S Demo</title>
<style>
body{background:#351516;color:white;font-family:Arial;text-align:center;padding:15px}
.box{background:#572426;padding:20px;border-radius:15px;margin:15px 0}
h1{color:#ffb5a5}
.timer{font-size:45px;color:#ffd080}
.number{font-size:55px;font-weight:bold}
table{width:100%;color:white}
td,th{padding:10px;border-bottom:1px solid #855}
</style>
</head>
<body>
<h1>WinGo 30S Demo</h1>
<div class="box">
<div>Period Number</div>
<h2 id="period">Loading...</h2>
<div class="timer" id="timer">30</div>
</div>
<div class="box">
<div>Number</div>
<div class="number" id="number">-</div>
<h2 id="color">-</h2>
<h2 id="size">-</h2>
</div>
<div class="box">
<h3>Game History</h3>
<table>
<thead><tr><th>Period</th><th>Number</th><th>Color</th><th>Size</th></tr></thead>
<tbody id="history"></tbody>
</table>
</div>
<script>
async function update(){
try{
const d=await fetch('/api/current').then(r=>r.json());
document.getElementById('period').textContent=d.period;
document.getElementById('timer').textContent=Math.ceil(d.remainingMs/1000);
document.getElementById('number').textContent=d.result.number;
document.getElementById('color').textContent=d.result.color;
document.getElementById('size').textContent=d.result.size;
const h=await fetch('/api/history?limit=20').then(r=>r.json());
document.getElementById('history').innerHTML=h.history.map(x=>
`<tr><td>${x.period}</td><td>${x.number}</td><td>${x.color}</td><td>${x.size}</td></tr>`
).join('');
}catch(e){}
}
update();
setInterval(update,1000);
</script>
</body>
</html>
